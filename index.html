<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="75 Soft">
<title>75 Soft</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#f4efe8; --card:#fffdf9; --ink:#2d2a26; --muted:#8a8178; --line:#e6ddd1;
    --accent:#c8734f; --accent-soft:#f3dccf; --done:#6f9a7c; --done-soft:#dbe9de; --miss:#e7d6d0;
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1d1b19; --card:#272421; --ink:#f1ebe3; --muted:#a0968b; --line:#3a352f;
      --accent:#e08b65; --accent-soft:#4a3329; --done:#86b893; --done-soft:#2c3b30; --miss:#3d302b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;align-items:baseline;justify-content:space-between;margin:8px 4px 18px}
  h1{font-size:28px;margin:0;letter-spacing:-.5px}
  h1 span{color:var(--accent)}
  .icon-btn{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  .hero{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:96px;height:96px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
  .ring .num b{font-size:30px;display:block}
  .ring .num small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;flex:1}
  .stat b{font-size:20px;display:block}
  .stat span{font-size:12px;color:var(--muted)}
  .daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .daynav h2{font-size:18px;margin:0;text-align:center}
  .daynav h2 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .daynav button{background:var(--bg);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
  .daynav button:disabled{opacity:.3;cursor:default}
  .task{display:flex;align-items:center;gap:14px;padding:13px 4px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
  .task:first-of-type{border-top:0}
  .check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.15s}
  .task.on .check{background:var(--done);border-color:var(--done)}
  .task.on .check::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
  .task .t{flex:1}
  .task .t b{display:block;font-weight:600}
  .task .t span{font-size:13px;color:var(--muted)}
  .task.on .t b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .water{display:flex;gap:4px;margin-top:6px}
  .water i{width:18px;height:22px;border-radius:4px 4px 6px 6px;border:1.5px solid var(--line);cursor:pointer}
  .water i.f{background:#7fb3d5;border-color:#7fb3d5}
  textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
  .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  .grid div{aspect-ratio:1;border-radius:7px;background:var(--bg);border:1px solid var(--line);font-size:10px;display:grid;place-items:center;color:var(--muted);cursor:pointer}
  .grid .full{background:var(--done);border-color:var(--done);color:#fff}
  .grid .part{background:var(--done-soft);border-color:var(--done-soft);color:var(--ink)}
  .grid .miss{background:var(--miss);border-color:var(--miss)}
  .grid .today{outline:2px solid var(--accent);outline-offset:1px}
  .grid .sel{box-shadow:inset 0 0 0 2px var(--ink)}
  .grid .future{opacity:.45;cursor:default}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
  /* setup / settings */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  input[type=date],input[type=text],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
  .rule-row{display:flex;gap:8px;margin-bottom:8px}
  .rule-row input{flex:1}
  .rule-row button{flex:none}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;width:100%}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:9px 14px;font-weight:500}
  .btn.danger{background:transparent;color:#c0563c;border:1px solid var(--line);width:auto;padding:9px 14px;font-weight:500}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  dialog{border:0;border-radius:var(--radius);padding:0;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:90vh}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  dialog .inner{padding:20px}
  .hidden{display:none!important}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
</style>
</head>
<body>
<main>
  <header>
    <h1>75 <span>Soft</span></h1>
    <button class="icon-btn" id="openSettings" aria-label="Settings">⚙︎</button>
  </header>

  <!-- First-run setup -->
  <section id="setup" class="card hidden">
    <h2 style="margin-top:0">Start your challenge</h2>
    <p style="color:var(--muted);margin-top:-6px">75 days of small, steady habits. Pick your start date and tweak the daily rules if you like.</p>
    <div class="field"><label for="startDate">Day 1</label><input type="date" id="startDate"></div>
    <p class="label">Daily rules</p>
    <div id="setupRules"></div>
    <button class="btn ghost" id="addRule" style="margin-bottom:16px">+ Add rule</button>
    <button class="btn" id="begin">Begin</button>
  </section>

  <!-- App -->
  <section id="app" class="hidden">
    <div class="card hero">
      <div class="ring">
        <svg width="96" height="96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--line)" stroke-width="8"/>
          <circle id="ringArc" cx="48" cy="48" r="42" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9" style="transition:stroke-dashoffset .5s"/></svg>
        <div class="num"><div><b id="dayNum">1</b><small>of 75</small></div></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sFull">0</b><span>perfect days</span></div>
        <div class="stat"><b id="sStreak">0</b><span>current streak</span></div>
        <div class="stat"><b id="sBest">0</b><span>best streak</span></div>
        <div class="stat"><b id="sLeft">75</b><span>days to go</span></div>
      </div>
    </div>

    <div class="card">
      <div id="banner" class="banner hidden"></div>
      <div class="daynav">
        <button id="prev" aria-label="Previous day">‹</button>
        <h2 id="dayTitle">Day 1<small></small></h2>
        <button id="next" aria-label="Next day">›</button>
      </div>
      <div id="tasks"></div>
      <p class="label" style="margin-top:16px">Notes</p>
      <textarea id="note" placeholder="How did today feel? What did you read?"></textarea>
    </div>

    <div class="card">
      <p class="label">All 75 days</p>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i style="background:var(--done)"></i>All done</span>
        <span><i style="background:var(--done-soft)"></i>Some done</span>
        <span><i style="background:var(--miss)"></i>Missed</span>
      </div>
    </div>
  </section>
</main>

<dialog id="settings"><div class="inner">
  <h2 style="margin-top:0">Settings</h2>
  <div class="field"><label for="setStart">Day 1</label><input type="date" id="setStart"></div>
  <div class="field"><label for="setWater">Water goal (glasses of 375 ml ≈ 3 L)</label><input type="number" id="setWater" min="1" max="16"></div>
  <p class="label">Daily rules</p>
  <div id="setRules"></div>
  <button class="btn ghost" id="setAddRule" style="margin-bottom:18px">+ Add rule</button>
  <p class="label">Backup</p>
  <div class="row" style="margin-bottom:18px">
    <button class="btn ghost" id="exportBtn">Export data</button>
    <button class="btn ghost" id="importBtn">Import data</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </div>
  <div class="row" style="justify-content:space-between">
    <button class="btn danger" id="resetBtn">Reset challenge</button>
    <div class="row"><button class="btn ghost" id="cancelSettings">Cancel</button><button class="btn" style="width:auto" id="saveSettings">Save</button></div>
  </div>
</div></dialog>

<script>
const KEY = "soft75:v1";
const TOTAL = 75;
const DEFAULT_RULES = [
  {id:"eat",   title:"Eat well", sub:"Alcohol only on social occasions"},
  {id:"move",  title:"45 min of movement", sub:"One day a week can be active recovery"},
  {id:"water", title:"Drink 3 L of water", sub:"Tap the glasses as you go", water:true},
  {id:"read",  title:"Read 10 pages", sub:"Any book counts"}
];

const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) } catch(e){ return null } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
let viewDay = 1;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dayDate = n => { const d = parseISO(S.start); d.setDate(d.getDate()+n-1); return d; };
function todayIndex(){
  const ms = new Date(new Date().toDateString()) - parseISO(S.start);
  return Math.round(ms/86400000) + 1;
}
const rec = n => (S.days[n] ||= {done:{}, water:0, note:""});
function isDone(n, r){ const d = S.days[n]; if(!d) return false;
  return r.water ? d.water >= S.waterGoal : !!d.done[r.id]; }
function dayStatus(n){
  const c = S.rules.filter(r => isDone(n,r)).length;
  return c === S.rules.length ? "full" : c > 0 ? "part" : "none";
}

/* ---------- setup & rule editors ---------- */
function ruleEditor(container, rules){
  container.innerHTML = "";
  rules.forEach((r,i) => {
    const row = document.createElement("div"); row.className = "rule-row";
    row.innerHTML = `<input type="text" value="${esc(r.title)}" placeholder="Rule" aria-label="Rule ${i+1}">
      <button class="btn ghost" aria-label="Remove rule">✕</button>`;
    row.querySelector("input").oninput = e => r.title = e.target.value;
    row.querySelector("button").onclick = () => { rules.splice(i,1); ruleEditor(container, rules); };
    container.appendChild(row);
  });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cleanRules = rules => rules.filter(r => r.title.trim()).map(r => ({...r, title:r.title.trim()}));
const newRule = () => ({id:"r"+Date.now().toString(36), title:"", sub:""});

let draftRules = DEFAULT_RULES.map(r => ({...r}));
function showSetup(){
  $("setup").classList.remove("hidden"); $("app").classList.add("hidden"); $("openSettings").classList.add("hidden");
  $("startDate").value = isoLocal(new Date());
  ruleEditor($("setupRules"), draftRules);
}
$("addRule").onclick = () => { draftRules.push(newRule()); ruleEditor($("setupRules"), draftRules); };
$("begin").onclick = () => {
  const rules = cleanRules(draftRules);
  if(!rules.length) return alertBanner("Add at least one rule.");
  S = {start:$("startDate").value || isoLocal(new Date()), rules, waterGoal:8, days:{}};
  store.save(S); boot();
};

/* ---------- main render ---------- */
function boot(){
  $("setup").classList.add("hidden"); $("app").classList.remove("hidden"); $("openSettings").classList.remove("hidden");
  const t = todayIndex();
  viewDay = Math.min(Math.max(t,1), TOTAL);
  render();
}

function render(){
  const t = todayIndex();
  // hero
  const shown = Math.min(Math.max(t,0), TOTAL);
  $("dayNum").textContent = t < 1 ? "–" : shown;
  $("ringArc").style.strokeDashoffset = 263.9 * (1 - Math.max(0,shown)/TOTAL);
  let full = 0, best = 0, run = 0;
  for(let n=1; n<=Math.min(t,TOTAL); n++){
    if(dayStatus(n) === "full"){ full++; run++; best = Math.max(best, run); } else if(n < t) run = 0;
  }
  // current streak: count back from today (today counts only if complete)
  let streak = 0;
  for(let n=Math.min(t,TOTAL); n>=1; n--){
    if(dayStatus(n) === "full") streak++;
    else if(n === t) continue; else break;
  }
  $("sFull").textContent = full; $("sStreak").textContent = streak; $("sBest").textContent = best;
  $("sLeft").textContent = Math.max(0, TOTAL - Math.max(t,0));

  // banner
  const b = $("banner");
  if(t < 1){ b.textContent = `Your challenge starts in ${1-t} day${1-t===1?"":"s"}. You can plan ahead below.`; b.classList.remove("hidden"); }
  else if(t > TOTAL){ b.textContent = `You finished all 75 days — ${full} of them perfect. 🎉`; b.classList.remove("hidden"); }
  else b.classList.add("hidden");

  // day nav
  const d = dayDate(viewDay);
  const label = viewDay === t ? "Today" : d.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
  $("dayTitle").innerHTML = `Day ${viewDay}<small>${label}</small>`;
  $("prev").disabled = viewDay <= 1;
  $("next").disabled = viewDay >= TOTAL || viewDay >= Math.max(t,1);

  // tasks
  const box = $("tasks"); box.innerHTML = "";
  S.rules.forEach(r => {
    const on = isDone(viewDay, r);
    const el = document.createElement("div");
    el.className = "task" + (on ? " on" : "");
    el.innerHTML = `<div class="check"></div><div class="t"><b>${esc(r.title)}</b>${r.sub?`<span>${esc(r.sub)}</span>`:""}
      ${r.water ? `<div class="water">${Array.from({length:S.waterGoal},(_,i)=>`<i data-i="${i}" class="${i < (S.days[viewDay]?.water||0) ? "f":""}"></i>`).join("")}</div>` : ""}</div>`;
    el.onclick = e => {
      const rd = rec(viewDay);
      if(r.water){
        const gi = e.target.dataset.i;
        if(gi !== undefined){ const v = +gi + 1; rd.water = rd.water === v ? v - 1 : v; }
        else rd.water = rd.water >= S.waterGoal ? 0 : S.waterGoal;
      } else rd.done[r.id] = !rd.done[r.id];
      const wasFull = el.dataset.full === "1";
      store.save(S); render();
      if(!wasFull && dayStatus(viewDay) === "full") celebrate();
    };
    el.dataset.full = dayStatus(viewDay) === "full" ? "1" : "0";
    box.appendChild(el);
  });
  $("note").value = S.days[viewDay]?.note || "";

  // grid
  const g = $("grid"); g.innerHTML = "";
  for(let n=1; n<=TOTAL; n++){
    const c = document.createElement("div"); c.textContent = n;
    const st = dayStatus(n);
    if(n > t) c.classList.add("future");
    else c.classList.add(st === "full" ? "full" : st === "part" ? "part" : (n < t ? "miss" : "x"));
    if(n === t) c.classList.add("today");
    if(n === viewDay) c.classList.add("sel");
    if(n <= Math.max(t,1)) c.onclick = () => { viewDay = n; render(); window.scrollTo({top:0, behavior:"smooth"}); };
    g.appendChild(c);
  }
}

$("note").oninput = e => { rec(viewDay).note = e.target.value; store.save(S); };
$("prev").onclick = () => { viewDay--; render(); };
$("next").onclick = () => { viewDay++; render(); };

function celebrate(){
  const wrap = document.createElement("div"); wrap.className = "confetti";
  const colors = ["#c8734f","#6f9a7c","#7fb3d5","#e8b84a","#d98fa8"];
  for(let i=0;i<60;i++){ const p = document.createElement("i");
    p.style.left = Math.random()*100+"vw"; p.style.background = colors[i%colors.length];
    p.style.animationDelay = Math.random()*.4+"s"; p.style.animationDuration = 1.2+Math.random()*.9+"s";
    wrap.appendChild(p); }
  document.body.appendChild(wrap); setTimeout(() => wrap.remove(), 2600);
}
function alertBanner(msg){ const b = document.createElement("div"); b.className="banner"; b.textContent = msg;
  $("setup").prepend(b); setTimeout(()=>b.remove(), 3000); }

/* ---------- settings ---------- */
let editRules = [];
$("openSettings").onclick = () => {
  $("setStart").value = S.start; $("setWater").value = S.waterGoal;
  editRules = S.rules.map(r => ({...r})); ruleEditor($("setRules"), editRules);
  $("settings").showModal();
};
$("setAddRule").onclick = () => { editRules.push(newRule()); ruleEditor($("setRules"), editRules); };
$("cancelSettings").onclick = () => $("settings").close();
$("saveSettings").onclick = () => {
  const rules = cleanRules(editRules); if(!rules.length) return;
  S.start = $("setStart").value || S.start;
  S.waterGoal = Math.min(16, Math.max(1, +$("setWater").value || 8));
  S.rules = rules; store.save(S); $("settings").close(); boot();
};
$("resetBtn").onclick = () => {
  if(!confirm("Delete all progress and start over?")) return;
  try { localStorage.removeItem(KEY); } catch(e){}
  S = null; $("settings").close(); draftRules = DEFAULT_RULES.map(r => ({...r})); showSetup();
};
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `75-soft-backup-${isoLocal(new Date())}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try { const data = JSON.parse(await f.text());
    if(!data.start || !Array.isArray(data.rules)) throw 0;
    S = {waterGoal:8, days:{}, ...data}; store.save(S); $("settings").close(); boot();
  } catch(_) { alert("That file doesn't look like a 75 Soft backup."); }
};

// refresh when the app is reopened on a new day
document.addEventListener("visibilitychange", () => { if(!document.hidden && S) render(); });

S ? boot() : showSetup();
</script>
</body>
</html>
